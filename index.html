<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Finn's Weekday Brain Training!</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ========================================= -->
    <!-- TRANSITION -->
    <!-- ========================================= -->

    <div id="screen-flash"></div>


    <main class="app">

        <!-- ========================================= -->
        <!-- HOME -->
        <!-- ========================================= -->

        <section id="home-screen" class="screen">

            <div class="home-inner">

                <h1>Finn's Weekday Brain Training!</h1>

                <p class="subtitle">
                    Calculate the weekday for <em>any date</em> in your head.
                </p>

                <div class="mode-menu">

                    <button class="mode-card" data-mode="tutorial">
                        <div class="mode-art">
                            ART
                        </div>

                        <div class="mode-card-content">
                            <h2>Tutorial</h2>
                            <p>
                                Start here! Learn the 10-step guide to the Doomsday Algorithm with guided questions.
                            </p>
                        </div>
                    </button>


                    <button class="mode-card" data-mode="practice">
                        <div class="mode-art">
                            ART
                        </div>

                        <div class="mode-card-content">
                            <h2>Practice</h2>
                            <p>
                                Target parts of the process with open-ended memory questions to improve your memory and speed.
                            </p>
                        </div>
                    </button>


                    <button class="mode-card" data-mode="guided">
                        <div class="mode-art">
                            ART
                        </div>

                        <div class="mode-card-content">
                            <h2>Guided</h2>
                            <p>
                                Solve random dates with three hints per question.
                            </p>
                        </div>
                    </button>


                    <button class="mode-card" data-mode="quiz">
                        <div class="mode-art">
                            ART
                        </div>

                        <div class="mode-card-content">
                            <h2>Quiz</h2>
                            <p>
                                Check your knowledge with a timed, customizable quiz!
                            </p>
                        </div>
                    </button>


                    <button class="mode-card" data-mode="endless">
                        <div class="mode-art">
                            ART
                        </div>

                        <div class="mode-card-content">
                            <h2>Endless</h2>
                            <p>
                                See how high of a streak you can get with rapid-fire questions.
                            </p>
                        </div>
                    </button>

                </div>

            </div>

        </section>


        <!-- ========================================= -->
        <!-- TUTORIAL -->
        <!-- ========================================= -->

        <section id="tutorial-screen" class="screen game-screen hidden">

            <div class="game-layout">

                <aside id="tutorial-sidebar" class="progress-sidebar">

                    <h2>Your Progress</h2>

                    <div id="tutorial-sidebar-date"></div>

                    <div id="tutorial-sidebar-steps"></div>

                </aside>


                <div class="game-column">

                    <div class="game-top">

                        <div id="tutorial-step-counter">
                            Step 0 of 10
                        </div>

                    </div>


                    <div class="date-display" id="tutorial-date"></div>


                    <div class="main-box">

                        <div id="tutorial-main-text"></div>

                    </div>


                    <div class="answer-box" id="tutorial-answer-box">

                        <div id="tutorial-question"></div>

                        <div id="tutorial-answers"></div>

                        <button id="tutorial-submit" class="submit-button hidden">
                            Submit
                        </button>

                    </div>


                    <div id="tutorial-feedback" class="feedback"></div>


                    <div class="below-buttons">

                        <button id="tutorial-next" class="text-button hidden">
                            Continue
                        </button>

                        <button id="tutorial-restart" class="text-button">
                            Restart
                        </button>

                        <button id="tutorial-home" class="text-button">
                            Back to Home
                        </button>

                    </div>

                </div>

            </div>

        </section>


        <!-- ========================================= -->
        <!-- GUIDED -->
        <!-- ========================================= -->

        <section id="guided-screen" class="screen game-screen hidden">

            <div class="game-layout">

                <aside id="guided-sidebar" class="progress-sidebar">

                    <h2>Hints</h2>

                    <div id="guided-sidebar-date"></div>

                    <div id="guided-hint-list"></div>

                </aside>


                <div class="game-column">

                    <div class="game-top">

                        <div class="mode-label">
                            Guided
                        </div>

                    </div>

                    <div class="date-display" id="guided-date"></div>

                    <div class="main-box">
                        <div id="guided-main-text"></div>
                    </div>

                    <div class="answer-box">

                        <div id="guided-question"></div>

                        <div id="guided-answers"></div>

                        <button id="guided-submit" class="submit-button hidden">
                            Submit
                        </button>

                    </div>

                    <div id="guided-feedback" class="feedback"></div>

                    <div class="below-buttons">

                        <button id="guided-next" class="text-button hidden">
                            Next
                        </button>

                        <button id="guided-restart" class="text-button">
                            Restart
                        </button>

                        <button id="guided-home" class="text-button">
                            Back to Home
                        </button>

                    </div>

                </div>

            </div>

        </section>


        <!-- ========================================= -->
        <!-- PRACTICE -->
        <!-- ========================================= -->

        <section id="practice-screen" class="screen game-screen hidden">

            <div class="game-column standalone-column">

                <div class="game-top">

                    <div class="mode-label">
                        Practice
                    </div>

                    <h2 id="practice-category-title">
                        Choose a category
                    </h2>

                </div>


                <div id="practice-category-box" class="category-grid">

                    <button class="category-button" data-category="weekdays">
                        Weekday Numbers
                    </button>

                    <button class="category-button" data-category="doomsdays">
                        Doomsday Dates
                    </button>

                    <button class="category-button" data-category="anchors">
                        Century Anchors
                    </button>

                    <button class="category-button" data-category="algorithm">
                        Algorithm Steps
                    </button>

                </div>


                <div id="practice-question-box" class="answer-box hidden">

                    <div id="practice-question"></div>

                    <input
                        id="practice-input"
                        type="text"
                        autocomplete="off"
                        placeholder="Type your answer..."
                    >

                    <button id="practice-submit" class="submit-button">
                        Submit
                    </button>

                </div>


                <div id="practice-feedback" class="feedback"></div>


                <div class="below-buttons">

                    <button id="practice-next" class="text-button hidden">
                        Next
                    </button>

                    <button id="practice-restart" class="text-button">
                        Restart
                    </button>

                    <button id="practice-home" class="text-button">
                        Back to Home
                    </button>

                </div>

            </div>

        </section>


        <!-- ========================================= -->
        <!-- QUIZ -->
        <!-- ========================================= -->

        <section id="quiz-screen" class="screen game-screen hidden">

            <div class="game-column standalone-column">

                <div class="game-top quiz-top">

                    <div class="mode-label">
                        Quiz
                    </div>

                    <div id="quiz-timer">
                        00:00
                    </div>

                </div>


                <!-- QUIZ SETUP -->

                <div id="quiz-setup" class="main-box">

                    <h2>Quiz Settings</h2>

                    <p>
                        How many questions would you like?
                    </p>

                    <div class="slider-row">

                        <input
                            id="quiz-count"
                            type="range"
                            min="1"
                            max="50"
                            value="10"
                        >

                        <strong id="quiz-count-display">
                            10
                        </strong>

                    </div>

                    <button id="quiz-start" class="black-button">
                        Start Quiz
                    </button>

                </div>


                <!-- QUIZ PLAY -->

                <div id="quiz-play" class="hidden">

                    <div class="date-display" id="quiz-date"></div>

                    <div class="main-box">
                        <div id="quiz-question">
                            Which weekday is this date?
                        </div>
                    </div>

                    <div class="answer-box">

                        <div id="quiz-answers"></div>

                        <button id="quiz-submit" class="submit-button hidden">
                            Submit
                        </button>

                    </div>

                    <div id="quiz-progress"></div>

                    <button id="quiz-end-early" class="text-button">
                        Back to Home
                    </button>

                </div>


                <!-- QUIZ RESULTS -->

                <div id="quiz-results" class="main-box hidden">

                    <div id="quiz-grade"></div>

                    <div id="quiz-score"></div>

                    <div id="quiz-message"></div>

                    <button id="quiz-results-home" class="black-button">
                        Back to Home
                    </button>

                </div>

            </div>

        </section>


        <!-- ========================================= -->
        <!-- ENDLESS -->
        <!-- ========================================= -->

        <section id="endless-screen" class="screen game-screen hidden">

            <div class="game-column standalone-column endless-column">

                <div class="endless-streak" id="endless-streak">
                    🔥0 Streak
                </div>


                <div class="game-top">

                    <div class="mode-label">
                        Endless
                    </div>

                </div>


                <div class="date-display" id="endless-date"></div>


                <div class="main-box">

                    <div>
                        Which weekday is this date?
                    </div>

                </div>


                <div class="answer-box">

                    <div id="endless-answers"></div>

                    <button id="endless-submit" class="submit-button hidden">
                        Submit
                    </button>

                </div>


                <div id="endless-feedback" class="feedback"></div>


                <div class="below-buttons">

                    <button id="endless-next" class="text-button hidden">
                        Next
                    </button>

                    <button id="endless-restart" class="text-button">
                        Restart
                    </button>

                    <button id="endless-home" class="text-button">
                        Back to Home
                    </button>

                </div>

            </div>

        </section>

    </main>


    <script src="game.js"></script>

</body>
</html>
